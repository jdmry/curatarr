<form class="scope-row{{ ' on' if enabled }}" data-title="{{ (entry.collection_title or '') | lower }}"
      hx-post="/posters/scope/entry" hx-trigger="change" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="library_key" value="{{ entry.library_key }}">
  <input type="hidden" name="library_title" value="{{ entry.library_title }}">
  <input type="hidden" name="collection_key" value="{{ entry.collection_key }}">
  <input type="hidden" name="collection_title" value="{{ entry.collection_title }}">
  <input type="hidden" name="count" value="{{ count if count is not none else '' }}">
  <label class="check">
    <input type="checkbox" name="enabled" value="1" {{ 'checked' if enabled }}>
    <span>
      {% if entry.collection_key %}{{ entry.collection_title }}{% else %}<strong>Whole library</strong>{% endif %}
      {% if count %}<span class="muted small">· {{ "{:,}".format(count | int) }} titles</span>{% endif %}
    </span>
  </label>
  <select name="source_id" {{ 'disabled' if not enabled }} aria-label="Poster source">
    <option value="">Default service{% if default_source %} ({{ default_source.name }}){% endif %}</option>
    {% for source in sources %}
    <option value="{{ source.id }}" {{ 'selected' if entry.source_id == source.id }}>{{ source.name }}</option>
    {% endfor %}
  </select>
</form>
